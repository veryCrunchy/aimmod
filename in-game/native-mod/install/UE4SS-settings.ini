; AimMod permanent-install profile for UE4SS v3.0.1-1152-ge3ba1016 on KovaaK's.
; Derived from scripts/ue4ss-settings/development.ini plus HookUObjectProcessEvent,
; the set verified stable on KovaaK's 3.9.11. The UE4SS defaults crash this game
; shortly after mods start: keep the global actor/viewport/map hooks off.
[Overrides]
ModsFolderPath =

[General]
EnableHotReloadSystem = 0
UseCache = 1
InvalidateCacheIfDLLDiffers = 1
SecondsToScanBeforeGivingUp = 120
bUseUObjectArrayCache = true

[EngineVersionOverride]
MajorVersion = 4
MinorVersion = 26

[ObjectDumper]
LoadAllAssetsBeforeDumpingObjects = 0

[CXXHeaderGenerator]
DumpOffsetsAndSizes = 1
KeepMemoryLayout = 0
LoadAllAssetsBeforeGeneratingCXXHeaders = 0

[UHTHeaderGenerator]
IgnoreAllCoreEngineModules = 0
IgnoreEngineAndCoreUObject = 0
MakeAllFunctionsBlueprintCallable = 1
MakeAllPropertyBlueprintsReadWrite = 1
MakeEnumClassesBlueprintType = 1
MakeAllConfigsEngineConfig = 1

[Debug]
ConsoleEnabled = 1
GuiConsoleEnabled = 1
GuiConsoleVisible = 0
GuiConsoleFontScaling = 1
GraphicsAPI = dx11
LiveViewObjectsPerGroup = 32768

[Threads]
SigScannerNumThreads = 1
SigScannerMultithreadingModuleSizeThreshold = 16777216

[Memory]
MaxMemoryUsageDuringAssetLoading = 85

[Hooks]
HookProcessInternal = 1
HookProcessLocalScriptFunction = 1
HookInitGameState = 0
HookLoadMap = 0
HookCallFunctionByNameWithArguments = 1
HookBeginPlay = 0
HookEndPlay = 0
HookLocalPlayerExec = 0
HookAActorTick = 0
; AimModCore and the Lua game-thread scheduler run from the engine tick.
HookEngineTick = 1
EngineTickResolveMethod = Scan
HookGameViewportClientTick = 0
; AimModCore observes framework broadcasts through ProcessEvent.
HookUObjectProcessEvent = 1
; Explicit values of the defaults the verified configuration ran with.
HookProcessConsoleExec = 1
HookUStructLink = 1
FExecVTableOffsetInLocalPlayer = 0x28

[CrashDump]
EnableDumping = 1
FullMemoryDump = 0

[ExperimentalFeatures]
GUIUFunctionCaller = 0
