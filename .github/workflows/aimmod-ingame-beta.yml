name: AimMod in-game Beta

# Every push to the in-game branch publishes a beta build to the beta channel,
# so testers on a beta install update from inside the game.

on:
  push:
    branches:
      - feat/kovaaks-in-game
    paths:
      - "in-game/**"
      - ".github/workflows/aimmod-ingame-*.yml"
  workflow_dispatch:

concurrency:
  group: aimmod-ingame-beta
  # A running build finishes; only the newest waiting push is kept.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          base=$(cat in-game/version.txt)
          [[ "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || exit 1
          echo "value=${BASH_REMATCH[1]}.$((10#${BASH_REMATCH[2]} + 1)).0-beta.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
  release:
    needs: version
    if: vars.AIMMOD_INGAME_RELEASES == 'true'
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/aimmod-ingame-release.yml
    with:
      version: ${{ needs.version.outputs.value }}
      channel: beta
      publish: true
    secrets: inherit
